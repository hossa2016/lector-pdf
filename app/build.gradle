plugins {
    id "com.android.application"
}

android {
    namespace "co.hernan.lectorpdf"
    compileSdk 34

    defaultConfig {
        applicationId "co.hernan.lectorpdf"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("lector.keystore")
            storePassword "lectorpdf"
            keyAlias "lector"
            keyPassword "lectorpdf"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
