name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk LectorPDF.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LectorPDF
          path: LectorPDF.apk
      - name: Publicar descarga
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Lector PDF (build ${{ github.run_number }})
          files: LectorPDF.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: write
